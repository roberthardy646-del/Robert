<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="woodBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c130e" />
      <stop offset="50%" stop-color="#2d1e16" />
      <stop offset="100%" stop-color="#0f0906" />
    </linearGradient>

    <linearGradient id="goldBrassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#b8860b" />
    </linearGradient>

    <linearGradient id="woodFinishGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a16207" />
      <stop offset="50%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <filter id="woodGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Disk -->
  <circle cx="256" cy="256" r="256" fill="url(#woodBgGrad)" />

  <!-- Outer Brass Ring -->
  <circle cx="256" cy="256" r="232" fill="none" stroke="url(#goldBrassGrad)" stroke-width="4" opacity="0.5" />

  <!-- Sculptural Mid-Century Armchair Graphic -->
  <g transform="translate(106, 116)">
    <!-- Chair Backrest Cushion -->
    <path d="M 60 70 Q 150 40 240 70 C 260 140 250 190 235 220 L 65 220 C 50 190 40 140 60 70 Z" fill="url(#woodFinishGrad)" stroke="url(#goldBrassGrad)" stroke-width="2" />
    
    <!-- Inner Velvet Cushion -->
    <path d="M 75 85 Q 150 60 225 85 C 240 140 230 180 220 205 L 80 205 C 70 180 60 140 75 85 Z" fill="#1c1917" stroke="url(#goldBrassGrad)" stroke-width="1" opacity="0.9" />

    <!-- Chair Seat Base Cushion -->
    <rect x="50" y="210" width="200" height="35" rx="12" fill="url(#woodFinishGrad)" stroke="url(#goldBrassGrad)" stroke-width="2" />
    
    <!-- Wooden Chair Legs (Angled Mid-Century Legs) -->
    <!-- Front Left Leg -->
    <polygon points="65,245 45,310 60,310 75,245" fill="url(#goldBrassGrad)" filter="url(#woodGlow)" />
    <!-- Front Right Leg -->
    <polygon points="235,245 225,310 240,310 255,245" fill="url(#goldBrassGrad)" filter="url(#woodGlow)" />
    <!-- Back Left Leg -->
    <polygon points="85,245 75,295 88,295 95,245" fill="#854d0e" />
    <!-- Back Right Leg -->
    <polygon points="215,245 205,295 218,295 225,245" fill="#854d0e" />
  </g>
</svg>
