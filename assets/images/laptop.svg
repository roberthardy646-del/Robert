<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#b8860b" />
    </linearGradient>

    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Disk -->
  <rect width="512" height="512" rx="256" fill="url(#bgGrad)" />

  <!-- Outer Glowing Aura -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.4" />

  <!-- Laptop Group -->
  <g transform="translate(106, 126)">
    <!-- Screen Outer Frame -->
    <rect x="25" y="10" width="250" height="160" rx="12" fill="#334155" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glow)" />
    
    <!-- Screen Glass Display -->
    <rect x="35" y="20" width="230" height="140" rx="6" fill="url(#screenGrad)" />
    
    <!-- Code Lines on Display -->
    <!-- Window controls -->
    <circle cx="48" cy="32" r="3.5" fill="#ef4444" />
    <circle cx="58" cy="32" r="3.5" fill="#f59e0b" />
    <circle cx="68" cy="32" r="3.5" fill="#10b981" />

    <!-- Code Line Graphics -->
    <rect x="48" y="48" width="60" height="6" rx="3" fill="#d4af37" opacity="0.9" />
    <rect x="114" y="48" width="40" height="6" rx="3" fill="#38bdf8" opacity="0.8" />
    
    <rect x="60" y="62" width="90" height="6" rx="3" fill="#818cf8" opacity="0.8" />
    <rect x="156" y="62" width="45" height="6" rx="3" fill="#34d399" opacity="0.8" />

    <rect x="60" y="76" width="120" height="6" rx="3" fill="#f472b6" opacity="0.8" />
    
    <rect x="48" y="90" width="70" height="6" rx="3" fill="#fbbf24" opacity="0.9" />
    <rect x="124" y="90" width="80" height="6" rx="3" fill="#38bdf8" opacity="0.8" />

    <rect x="60" y="104" width="110" height="6" rx="3" fill="#a78bfa" opacity="0.8" />
    <rect x="60" y="118" width="65" height="6" rx="3" fill="#34d399" opacity="0.8" />

    <rect x="48" y="132" width="45" height="6" rx="3" fill="#d4af37" opacity="0.9" />

    <!-- Laptop Hinge Base -->
    <path d="M 0 170 L 300 170 L 280 192 C 275 197 265 200 255 200 L 45 200 C 35 200 25 197 20 192 Z" fill="#475569" stroke="url(#goldGrad)" stroke-width="2" />
    
    <!-- Trackpad Line -->
    <rect x="120" y="178" width="60" height="14" rx="3" fill="#1e293b" stroke="rgba(212, 175, 55, 0.4)" stroke-width="1" />
  </g>
</svg>
