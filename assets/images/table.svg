<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTableGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>
    <linearGradient id="oakWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="brassLeg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
  </defs>

  <rect width="600" height="350" rx="16" fill="url(#bgTableGrad)" />

  <!-- Subtle Ambient Table Glow -->
  <ellipse cx="300" cy="220" rx="220" ry="40" fill="#d4af37" opacity="0.08" />

  <!-- Dining Table Surface Top -->
  <polygon points="80,140 520,140 480,185 120,185" fill="url(#oakWood)" stroke="#f59e0b" stroke-width="2" />
  
  <!-- Table Front Edge -->
  <polygon points="120,185 480,185 480,195 120,195" fill="#92400e" />

  <!-- Brass Tapered Legs -->
  <polygon points="150,195 162,195 145,290 137,290" fill="url(#brassLeg)" />
  <polygon points="450,195 438,195 455,290 463,290" fill="url(#brassLeg)" />
  <polygon points="200,185 210,185 198,275 190,275" fill="#78350f" opacity="0.8" />
  <polygon points="400,185 390,185 402,275 410,275" fill="#78350f" opacity="0.8" />
</svg>
