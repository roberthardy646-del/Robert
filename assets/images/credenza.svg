<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCredenzaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="walnutWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#270e02" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
  </defs>

  <rect width="600" height="350" rx="16" fill="url(#bgCredenzaGrad)" />

  <!-- Credenza Main Cabinet Body -->
  <rect x="90" y="110" width="420" height="150" rx="8" fill="url(#walnutWood)" stroke="url(#goldAccent)" stroke-width="2" />

  <!-- Vertical Fluted Door Panels -->
  <line x1="195" y1="110" x2="195" y2="260" stroke="#f59e0b" stroke-width="1.5" opacity="0.6" />
  <line x1="300" y1="110" x2="300" y2="260" stroke="#f59e0b" stroke-width="1.5" opacity="0.6" />
  <line x1="405" y1="110" x2="405" y2="260" stroke="#f59e0b" stroke-width="1.5" opacity="0.6" />

  <!-- Brass Door Handles -->
  <circle cx="180" cy="185" r="4" fill="url(#goldAccent)" />
  <circle cx="210" cy="185" r="4" fill="url(#goldAccent)" />
  <circle cx="285" cy="185" r="4" fill="url(#goldAccent)" />
  <circle cx="315" cy="185" r="4" fill="url(#goldAccent)" />

  <!-- Brass Legs -->
  <line x1="120" y1="260" x2="110" y2="295" stroke="url(#goldAccent)" stroke-width="4" stroke-linecap="round" />
  <line x1="480" y1="260" x2="490" y2="295" stroke="url(#goldAccent)" stroke-width="4" stroke-linecap="round" />
  <line x1="150" y1="260" x2="145" y2="295" stroke="url(#goldAccent)" stroke-width="3" opacity="0.7" />
  <line x1="450" y1="260" x2="455" y2="295" stroke="url(#goldAccent)" stroke-width="3" opacity="0.7" />
</svg>
