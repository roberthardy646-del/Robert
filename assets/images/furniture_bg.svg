<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradPattern" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090c12" />
      <stop offset="50%" stop-color="#111622" />
      <stop offset="100%" stop-color="#06080c" />
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#bgGradPattern)" />

  <!-- Subtle Repeating Furniture Line Art Pattern -->
  <g stroke="#d4af37" stroke-width="1.5" fill="none" opacity="0.08">
    <!-- Armchair Outlines -->
    <g transform="translate(60, 60)">
      <path d="M 20 20 Q 60 5 100 20 L 90 70 L 30 70 Z" />
      <rect x="15" y="70" width="90" height="15" rx="4" />
      <line x1="25" y1="85" x2="15" y2="120" />
      <line x1="95" y1="85" x2="105" y2="120" />
    </g>

    <g transform="translate(460, 80)">
      <polygon points="20,40 140,40 120,70 40,70" />
      <line x1="45" y1="70" x2="35" y2="130" />
      <line x1="115" y1="70" x2="125" y2="130" />
    </g>

    <!-- Credenza Outlines -->
    <g transform="translate(200, 300)">
      <rect x="0" y="0" width="220" height="90" rx="6" />
      <line x1="73" y1="0" x2="73" y2="90" />
      <line x1="146" y1="0" x2="146" y2="90" />
      <line x1="20" y1="90" x2="15" y2="120" />
      <line x1="200" y1="90" x2="205" y2="120" />
    </g>

    <!-- Floor Lamp Outlines -->
    <g transform="translate(640, 260)">
      <path d="M 30 10 L 70 10 L 80 50 L 20 50 Z" />
      <line x1="50" y1="50" x2="50" y2="200" />
      <line x1="20" y1="200" x2="80" y2="200" />
    </g>

    <g transform="translate(100, 540)">
      <path d="M 20 20 Q 60 5 100 20 L 90 70 L 30 70 Z" />
      <rect x="15" y="70" width="90" height="15" rx="4" />
      <line x1="25" y1="85" x2="15" y2="120" />
      <line x1="95" y1="85" x2="105" y2="120" />
    </g>

    <g transform="translate(500, 560)">
      <polygon points="20,40 140,40 120,70 40,70" />
      <line x1="45" y1="70" x2="35" y2="130" />
      <line x1="115" y1="70" x2="125" y2="130" />
    </g>
  </g>
</svg>
